<!DOCTYPE html>
<html th:replace="~{fragments/layout :: page(titulo='Cursos disponíveis', conteudo=~{::section}, ativo='cursos')}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<section>
    <div class="ox-page-header">
        <div>
            <h1 class="h4">Cursos disponíveis</h1>
            <p class="ox-page-sub">Conheça os cursos ativos e veja os detalhes antes de se matricular.</p>
        </div>
        <div class="ox-toolbar">
            <select id="filtroCategoria" class="form-select form-select-sm" style="width:auto">
                <option value="todas">Todas as categorias</option>
                <option th:each="curso : ${cursos}" th:value="${curso.categoria}" th:text="${curso.categoria}">Categoria</option>
            </select>
            <div class="ox-search">
                <i class="bi bi-search"></i>
                <input id="buscaCurso" type="search" class="form-control form-control-sm" placeholder="Buscar curso..." style="width:200px"/>
            </div>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-6 col-md-4 col-lg-3" th:each="curso : ${cursos}"
             th:attr="data-categoria=${curso.categoria}, data-nome=${curso.nome}">
            <a th:href="@{/cursos/{id}(id=${curso.id})}" class="ox-card d-block h-100 text-decoration-none text-dark">
                <div class="ox-card-thumb">
                    <span class="ox-thumb-icon" th:switch="${curso.categoria}">
                        <i th:case="'Programação'" class="bi bi-code-slash"></i>
                        <i th:case="'Backend'" class="bi bi-hdd-network"></i>
                        <i th:case="'Front-end'" class="bi bi-braces-asterisk"></i>
                        <i th:case="'Banco de Dados'" class="bi bi-database"></i>
                        <i th:case="'Design'" class="bi bi-palette"></i>
                        <i th:case="'Idiomas'" class="bi bi-translate"></i>
                        <i th:case="'Matemática'" class="bi bi-calculator"></i>
                        <i th:case="*" class="bi bi-journal-bookmark"></i>
                    </span>
                </div>
                <div class="ox-card-body">
                    <span class="ox-chip mb-2" th:text="${curso.categoria}">Categoria</span>
                    <h2 class="h6 mb-1" th:text="${curso.nome}">Curso</h2>
                    <p class="small text-secondary mb-1" th:text="${curso.professor}">Professor</p>
                    <p class="small text-secondary mb-0">
                        <i class="bi bi-clock"></i> <span th:text="${curso.cargaHoraria} + 'h'">40h</span>
                    </p>
                </div>
            </a>
        </div>
    </div>

    <div class="ox-card ox-empty mt-3" th:if="${#lists.isEmpty(cursos)}">
        <i class="bi bi-book"></i>
        Nenhum curso disponível no momento.
    </div>

</section>
</body>
</html>
