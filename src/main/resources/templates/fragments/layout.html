<!DOCTYPE html>
<!--
  Fragmento de layout base.
  Uso em cada página:

  <html th:replace="~{fragments/layout :: page(titulo='Home', conteudo=~{::section}, ativo='home')}">
  <body><section> ... conteúdo da página ... </section></body>
  </html>
-->
<html xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="page(titulo, conteudo, ativo)">
    <!DOCTYPE html>
    <html lang="pt-BR">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <title th:text="${titulo} + ' · OxeSchool'">OxeSchool</title>

        <!-- Bootstrap 5 (CDN) -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
        <!-- Bootstrap Icons -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
        <!-- Fontes -->
        <link rel="preconnect" href="https://fonts.googleapis.com"/>
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
        <!-- Tokens do OxeSchool -->
        <link th:href="@{/css/oxeschool.css}" rel="stylesheet"/>
        <!-- Componentes e ajustes por página -->
        <link th:href="@{/css/componentes.css}" rel="stylesheet"/>
        <link th:href="@{/css/telas.css}" rel="stylesheet"/>
    </head>
    <body th:class="|pagina-${ativo}|">

    <nav class="navbar navbar-expand-lg ox-navbar sticky-top">
        <div class="container">
            <a class="navbar-brand ox-brand" th:href="@{/}">Oxe<span style="color:var(--ox-highlight)">School</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#ox-nav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="ox-nav">
                <ul class="navbar-nav ms-auto gap-2">
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${ativo == 'home'} ? 'active'" th:href="@{/home}">
                            <i class="bi bi-house"></i> Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${ativo == 'cursos'} ? 'active'" th:href="@{/cursos}">
                            <i class="bi bi-book"></i> Cursos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${ativo == 'matriculas'} ? 'active'" th:href="@{/matriculas}">
                            <i class="bi bi-clipboard-check"></i> Matrículas
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${ativo == 'perfil'} ? 'active'" th:href="@{/perfil}">
                            <i class="bi bi-person-circle"></i> Perfil
                        </a>
                    </li>
                </ul>
            </div>
        </div>
        <div class="ox-ribbon ox-ribbon-thin"></div>
    </nav>

    <script th:inline="javascript">
        /*<![CDATA[*/
        var paginaPublica = /*[[${ativo == 'login' or ativo == 'cadastro'}]]*/ false;
        if (!paginaPublica && !localStorage.getItem('oxeschool_token')) {
            window.location.href = '/login';
        }
        /*]]>*/
    </script>

    <main th:replace="${conteudo}">
        <!-- conteúdo da página entra aqui -->
    </main>

    <footer class="border-top py-4 mt-5">
        <div class="container d-flex justify-content-between text-secondary small">
            <span>&copy; OxeSchool</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/oxeschool.js}"></script>
    </body>
    </html>
</th:block>

</body>
</html>
