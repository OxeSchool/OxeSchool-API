<!DOCTYPE html>
<html th:replace="~{fragments/layout :: page(titulo='Home', conteudo=~{::section}, ativo='home')}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<section>

    <!-- Atalhos gerais do sistema -->
    <div class="d-flex flex-wrap gap-2 mb-4">
        <a th:href="@{/cursos}" class="btn btn-ox-outline btn-sm rounded-pill px-3">
            <i class="bi bi-collection"></i> Meus cursos
        </a>
        <a th:href="@{/matriculas}" class="btn btn-ox-outline btn-sm rounded-pill px-3">
            <i class="bi bi-clipboard-check"></i> Matrículas
        </a>
        <a th:href="@{/perfil}" class="btn btn-ox-outline btn-sm rounded-pill px-3">
            <i class="bi bi-person"></i> Meu perfil
        </a>
    </div>

    <!-- Últimos cursos acessados -->
    <h2 class="h4 ox-section-title"><i class="bi bi-play-circle"></i> Continue de onde parou</h2>
    <div class="ox-scroll-row mb-5">
        <div class="ox-scroll-item" th:each="curso : ${ultimosCursos}">
            <div class="ox-card h-100">
                <div class="ox-card-thumb">
                    <span class="ox-thumb-icon" th:switch="${curso.categoria}">
                        <i th:case="'Programação'" class="bi bi-code-slash"></i>
                        <i th:case="'Backend'" class="bi bi-hdd-network"></i>
                        <i th:case="'Front-end'" class="bi bi-braces-asterisk"></i>
                        <i th:case="'Banco de Dados'" class="bi bi-database"></i>
                        <i th:case="'Design'" class="bi bi-palette"></i>
                        <i th:case="'Idiomas'" class="bi bi-translate"></i>
                        <i th:case="'Matemática'" class="bi bi-calculator"></i>
                        <i th:case="*" class="bi bi-journal-bookmark"></i>
                    </span>
                </div>
                <div class="ox-card-body">
                    <span class="ox-chip mb-2" th:text="${curso.categoria}">Categoria</span>
                    <h3 class="h6 mb-1" th:text="${curso.nome}">Nome do curso</h3>
                    <div class="ox-progress my-2">
                        <div class="ox-progress-bar" th:style="'width:' + ${curso.progresso} + '%'"></div>
                    </div>
                    <small class="text-secondary" th:text="${curso.progresso} + '% concluído'">0% concluído</small>
                </div>
            </div>
        </div>

        <!-- fallback quando não há dado ainda -->
        <div class="ox-scroll-item" th:if="${ultimosCursos == null or #lists.isEmpty(ultimosCursos)}">
            <div class="ox-card h-100 d-flex align-items-center justify-content-center text-secondary p-4">
                Nenhum curso acessado ainda
            </div>
        </div>
    </div>

    <!-- Galeria de cursos disponíveis (filtrável) -->
    <div class="ox-page-header">
        <h2 class="h4 mb-0"><i class="bi bi-collection"></i> Galeria de cursos</h2>
        <div class="ox-toolbar">
            <select id="filtroCategoria" class="form-select form-select-sm" style="width:auto">
                <option value="todas">Todas as categorias</option>
                <option th:each="cat : ${categorias}" th:value="${cat}" th:text="${cat}">Categoria</option>
            </select>
            <div class="ox-search">
                <i class="bi bi-search"></i>
                <input id="buscaCurso" type="search" class="form-control form-control-sm" placeholder="Buscar curso..." style="width:220px"/>
            </div>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-6 col-md-4 col-lg-3" th:each="curso : ${cursosDisponiveis}"
             th:attr="data-categoria=${curso.categoria}, data-nome=${curso.nome}">
            <div class="ox-card h-100">
                <div class="ox-card-thumb">
                    <span class="ox-thumb-icon" th:switch="${curso.categoria}">
                        <i th:case="'Programação'" class="bi bi-code-slash"></i>
                        <i th:case="'Backend'" class="bi bi-hdd-network"></i>
                        <i th:case="'Front-end'" class="bi bi-braces-asterisk"></i>
                        <i th:case="'Banco de Dados'" class="bi bi-database"></i>
                        <i th:case="'Design'" class="bi bi-palette"></i>
                        <i th:case="'Idiomas'" class="bi bi-translate"></i>
                        <i th:case="'Matemática'" class="bi bi-calculator"></i>
                        <i th:case="*" class="bi bi-journal-bookmark"></i>
                    </span>
                </div>
                <div class="ox-card-body">
                    <span class="ox-chip mb-2" th:text="${curso.categoria}">Categoria</span>
                    <h3 class="h6 mb-1" th:text="${curso.nome}">Nome do curso</h3>
                    <p class="small text-secondary mb-0" th:text="${curso.professor}">Professor</p>
                </div>
            </div>
        </div>
    </div>

</section>
</body>
</html>
