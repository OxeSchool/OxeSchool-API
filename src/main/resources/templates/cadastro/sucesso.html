<!DOCTYPE html>
<html th:replace="~{fragments/layout :: page(titulo='Cadastro realizado', conteudo=~{::section}, ativo='cadastro')}"
      xmlns:th="http://www.thymeleaf.org">
<body>
<section>
    <div class="row justify-content-center py-4">
        <div class="col-12 col-sm-8 col-md-6 col-lg-5">
            <div class="ox-card ox-form-card text-center">
                <div class="ox-card-body">
                    <div class="text-success mb-3" style="font-size: 3rem;">&#10003;</div>
                    <h1 class="h4 mb-3">Cadastro realizado com sucesso!</h1>
                    <p class="mb-1"><strong>Nome:</strong> <span th:text="${nome}"></span></p>
                    <p class="mb-1"><strong>Email:</strong> <span th:text="${email}"></span></p>
                    <p class="mb-4"><strong>Tipo:</strong> <span th:text="${tipo}"></span></p>
                    <a href="/login" class="btn btn-ox-primary rounded-pill">Entrar</a>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
